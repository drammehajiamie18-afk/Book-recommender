 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Recommendation Engine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <header>
      <h1>📚 Book Finder Engine</h1>
      <p>Select your reading preferences below to discover your next favorite book!</p>
    </header>

    <!-- User Preference Form -->
    <section class="form-card">
      <div class="form-group">
        <label for="genreSelect">Preferred Genre:</label>
        <select id="genreSelect">
          <option value="any">Any Genre</option>
          <option value="fantasy">Fantasy</option>
          <option value="sci-fi">Sci-Fi</option>
          <option value="thriller">Thriller</option>
            <option value="dark-romance">Dark Romance</option>
            <option value="mm-romance">MM Romance</option>
          <option value="non-fiction">Non-Fiction</option>
        </select>
      </div>

      <div class="form-group">
        <label for="pacingSelect">Reading Pace:</label>
        <select id="pacingSelect">
          <option value="any">Any Pace</option>
          <option value="fast">Fast-Paced / Page Turner</option>
          <option value="slow">Slow Burn / Detailed Worldbuilding</option>
        </select>
      </div>

      <div class="form-group">
        <label for="lengthSelect">Book Length:</label>
        <select id="lengthSelect">
          <option value="any">Any Length</option>
          <option value="medium">Medium (300-500 pages)</option>
          <option value="long">Long (>500 pages)</option>
        </select>
      </div>

      <button id="recommendBtn">Get Recommendations</button>
    </section>

    <!-- Results Section where JavaScript will display matching book cards -->
    <section id="resultsContainer" class="results-grid">
      <!-- Recommendations will dynamically populate here -->
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>s
