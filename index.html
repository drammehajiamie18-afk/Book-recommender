<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Finder Engine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <header>
      <h1>📚 Book Finder Engine</h1>
      <p>Select your reading preferences below to discover your next favorite book!</p>
    </header>

    <div class="form-card">
      <div class="form-group">
        <label for="genreSelect">Preferred Genre:</label>
        <select id="genreSelect">
          <option value="any">Any Genre</option>
          <option value="fantasy">Fantasy</option>
          <option value="romance">Romance</option>
          <option value="thriller">Thriller</option>
          <option value="sci-fi">Science Fiction</option>
          <option value="mystery">Mystery</option>
        </select>
      </div>

      <div class="form-group">
        <label for="lengthSelect">Book Length:</label>
        <select id="lengthSelect">
          <option value="any">Any Length</option>
          <option value="short">Short (&lt; 300 pages)</option>
          <option value="medium">Medium (300-500 pages)</option>
          <option value="epic">Epic (500+ pages)</option>
        </select>
      </div>

      <button id="recommendBtn">Get Recommendations</button>
    </div>

    <main id="resultsContainer" class="results-grid"></main>
  </div>

  <script src="app.js"></script>
</body>
</html>
